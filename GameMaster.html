{cat:"🧠 Emotional Intelligence",q:"What is the most productive first response when you feel a strong sense of anger rising?",opts:["Express the anger immediately and loudly so it doesn't build up inside","Send messages to the person instantly so they understand your feelings","Pause, breathe deeply for 60–90 seconds to allow adrenaline to subside, then respond thoughtfully","Suppress the anger completely and pretend it never happened"],ans:2,fact:"When you feel intense anger, your amygdala — the brain's alarm system — floods your body with adrenaline and cortisol, temporarily impairing the prefrontal cortex responsible for rational decision-making. This 'amygdala hijack' makes impulsive responses feel logical when they are not. Deep, slow breathing activates the parasympathetic nervous system, measurably lowering your heart rate and cortisol levels within 60–90 seconds. This is called 'emotional regulation' — the ability to experience feelings without being controlled by them. Research consistently shows that people with high emotional regulation achieve more academically, earn more, have healthier relationships, and report greater life satisfaction."},
{cat:"🚦 Safety & Awareness",q:"What is India's unified emergency services number, and what does it cover?",opts:["100 — police only","108 — ambulance only","112 — covers police, ambulance, and fire services through one single number","911 — the universal global emergency number"],ans:2,fact:"India launched the unified 112 emergency number in 2019 to replace the fragmented old system (100 for police, 108 for ambulance, 101 for fire) which caused dangerous confusion during emergencies. When you call 112, state your location first — street, landmark, district — then the nature of emergency, then your name. The dispatcher remains on the line to guide you until help arrives. Memorising 112 and teaching it to younger siblings could directly save a life. Emergency systems exist because trained professionals can provide life-saving guidance even over the phone — but only if you know to call and what to say."},
{cat:"🤝 Values & Character",q:"A friend asks you to share your homework with them to copy — not as a one-off, but as a daily habit. What is the most genuinely helpful response?",opts:["Always share it — supporting friends in every way is what friendship means","Refuse firmly and explain that copying deprives them of actually learning — and puts both of you at risk","Share it secretly and hope no one discovers it","Report them to the teacher immediately without speaking to them first"],ans:1,fact:"Academic integrity means your grades represent what YOU have actually learned — not what someone else did. Your friend, by copying daily, misses the actual learning, which will hurt them in high-stakes exams and real-world applications. If caught, both students typically face equal consequences — so you're putting yourself at risk out of misplaced kindness. Offering to explain the work, study together, or help them understand the concepts is genuine friendship. True integrity is doing the right thing even when it costs you social comfort — and it builds a reputation that will serve you your entire professional life."},
{cat:"🌍 Environment & Nature",q:"Approximately how long does a plastic bottle take to decompose in a landfill environment?",opts:["5 years","50 years","450 years","10,000 years"],ans:2,fact:"A single plastic bottle you drink from today will physically exist on Earth for approximately 450 years — long after everyone alive today is gone. Plastic does not truly biodegrade; it breaks into progressively smaller fragments called microplastics, now found in Arctic ice, deep ocean trenches, fish tissue, drinking water sources, and — in alarming recent research — in human blood and placentas. Over one million plastic bottles are purchased globally every minute. At current rates, the ocean will contain more plastic by weight than fish by 2050. Choosing reusable containers is among the highest-impact individual environmental decisions you can make."},
{cat:"💰 Financial Literacy",q:"What is the fundamental difference between using a debit card and a credit card?",opts:["They function identically — both are just convenient alternatives to cash","A debit card spends money already in your account; a credit card lets you spend borrowed money you must repay later, often with very high interest","A credit card is exclusively for business use — not for individuals","A debit card charges higher transaction fees than a credit card in all situations"],ans:1,fact:"A debit card is a digital window into your existing bank balance — you can only spend what you have. A credit card is a short-term loan: you spend the bank's money with a promise to repay, but if you pay only the minimum amount each month, interest charges of 30–45% per year can quickly spiral into serious debt. Millions of adults fall into debt traps by misusing credit cards. Used responsibly — spending only what you can repay in full each month — a credit card builds credit history and provides purchase protection. The golden rule: never charge to a credit card what you could not pay for with your debit card right now."},
{cat:"🥦 Health & Nutrition",q:"Why is consistent 8–9 hours of sleep per night especially critical during the teenage years?",opts:["It is not especially critical — sleep is simply passive rest and the body doesn't care how much it gets","During sleep, the brain consolidates memories, the body repairs tissue, growth hormone is released, and the immune system is significantly strengthened","Less sleep means more productive study hours, which makes teenagers academically smarter","Sleep requirements actually decrease progressively as children mature into teenagers"],ans:1,fact:"Sleep is one of the most biologically active states your body enters — far from passive rest. During deep sleep, your hippocampus transfers everything learned that day into long-term memory — this is literally why cramming the night before an exam by sacrificing sleep is counterproductive. Growth hormone is released almost exclusively during deep sleep phases — teenagers physically grow taller while sleeping. Chronic sleep deprivation in adolescents is clinically linked to anxiety, depression, obesity, weakened immune response, and impaired decision-making. The World Health Organisation recommends 8–10 hours for teenagers. Prioritising sleep is not laziness — it is scientifically one of the highest-leverage health choices you can make."},
{cat:"🔬 Science of Everyday Life",q:"Why does a ball thrown upward slow down, momentarily stop, then accelerate back downward?",opts:["The ball physically exhausts its stored energy and runs out","Earth's gravitational field continuously exerts a downward force on the ball, decelerating it on the way up and accelerating it on the way down","Air resistance pulls the ball downward with increasing force","The sun's magnetic field repels objects thrown upward from Earth's surface"],ans:1,fact:"Gravity is a continuous attractive force between any two objects with mass. Earth's gravity accelerates all objects toward its centre at 9.8 m/s² — meaning every second a freely falling object gains 9.8 m/s of downward speed. Isaac Newton formalised this in his Law of Universal Gravitation in 1687, which simultaneously explained falling apples, orbiting moons, and the paths of planets. Einstein later revealed gravity is actually the curvature of space-time created by mass — a profound reimagining. The same equation governing your thrown ball governs satellite orbits, black hole formation, and the gravitational waves detected by LIGO — all described by identical mathematical laws."},
{cat:"🧮 Practical Math & Logic",q:"You invest ₹1,000 in a scheme that doubles in value every 7 years. How much will you have after 21 years?",opts:["₹3,000","₹6,000","₹7,000","₹8,000"],ans:3,fact:"Three doublings in 21 years: ₹1,000 → ₹2,000 → ₹4,000 → ₹8,000. This is the Rule of 72 in action: divide 72 by the annual interest rate to estimate the number of years for money to double. At approximately 10% annual returns (achievable through long-term equity investments), money doubles every 7.2 years. The lesson is transformational: ₹1,000 invested at age 15 becomes ₹8,000 by age 36 without any additional contributions — purely through compound growth. Starting to invest even small amounts in your teenage years gives you 3–4 more doubling cycles than someone who starts at 30, potentially resulting in 8–16 times more wealth at retirement."},
{cat:"🗺️ World & Cultures",q:"The United Nations has approximately how many member states, and what is its primary purpose?",opts:["54 member states — primarily to regulate international trade","120 member states — primarily to manage global currency systems","193 member states — primarily to maintain international peace, protect human rights, and promote sustainable development","220 member states — primarily to coordinate global military alliances"],ans:2,fact:"The United Nations was founded in 1945 with 51 original members after World War II devastated the world — today it has 193, representing virtually every nation on Earth. Its foundational documents include the UN Charter and the Universal Declaration of Human Rights (1948), which enshrines rights belonging to every human being regardless of nationality, gender, religion, or race. India was a founding member and has contributed more peacekeeping troops to UN missions than almost any other country. The UN's Sustainable Development Goals (SDGs) — 17 goals to be achieved by 2030 — represent humanity's most ambitious cooperative plan. Understanding global institutions helps you see how international agreements shape the world you will live and work in."},
{cat:"💻 Digital Literacy & Safety",q:"What is two-factor authentication (2FA) and why is it critically important for account security?",opts:["Antivirus software that runs two scans simultaneously for double protection","A security process requiring two separate verification steps to access an account, making it dramatically harder for attackers to gain access even if they have your password","Having two completely different passwords for the same account on different devices","A setting that requires approval from two separate people before any online purchase is completed"],ans:1,fact:"Over 80% of hacking-related security breaches involve stolen or weak passwords alone — 2FA directly addresses this vulnerability. Even if an attacker obtains your password through phishing or a data breach, 2FA requires them to also possess your physical phone (for the one-time code) — an almost impossible additional barrier. Enabling 2FA on your email alone protects your entire digital identity, since email is used to reset passwords for every other account. Most major services — Google, Instagram, banking apps — offer free 2FA in security settings, taking under 2 minutes to enable. Your digital identity is connected to your finances, education records, and personal communications — it deserves the same protection as a physically locked safe."},
{cat:"🧠 Emotional Intelligence",q:"What does the psychological concept of 'cognitive dissonance' describe?",opts:["A clinical inability to make decisions under time pressure","The mental discomfort experienced when holding two contradictory beliefs simultaneously, or when actions conflict with stated values","An exceptional ability to memorise and recall factual information rapidly","A medical neurological condition that affects sustained concentration"],ans:1,fact:"Cognitive dissonance was identified by psychologist Leon Festinger in 1957. When you claim 'I value honesty' but lie to avoid a difficult conversation, you experience the uncomfortable internal tension of cognitive dissonance. The brain instinctively tries to resolve this by either changing the behaviour, rationalising the inconsistency, or downgrading the importance of the value. Recognising when you are experiencing cognitive dissonance — the moment your actions diverge from your stated values — is the most honest form of self-awareness. The greatest personal growth happens precisely in those moments: choosing to change the behaviour rather than change the belief. This is the engine of moral and intellectual development."},
{cat:"🚦 Safety & Awareness",q:"What is 'confirmation bias' and why is it particularly dangerous when consuming news and social media?",opts:["A tendency to only read long, detailed news articles and skip brief ones","The brain's tendency to actively seek out and disproportionately trust information that confirms existing beliefs, while dismissing contradictory evidence","Deliberately choosing to trust only official government news sources for all information","A specific type of internet fraud that specifically targets regular news readers"],ans:1,fact:"Confirmation bias is one of the most powerful and universal cognitive biases — our brains evolved to seek confirmation because it was efficient for survival, but it distorts rational thinking. Social media algorithms learn your preferences and deliberately show you content you already agree with, creating information 'echo chambers' where your existing views are constantly reinforced. This is precisely how misinformation spreads virally — people share headlines matching their worldview without reading the actual article. To actively counteract confirmation bias: deliberately read one well-argued perspective you disagree with weekly, and honestly ask yourself 'what evidence would genuinely change my mind?' This is the hallmark of a critical thinker."},
{cat:"🤝 Values & Character",q:"What is the core ethical dilemma explored by 'the trolley problem' thought experiment?",opts:["A practical logistics problem about public transport scheduling and efficiency","A philosophical thought experiment testing whether it is ethically justifiable to sacrifice one life to save multiple lives, revealing fundamental tensions between different moral frameworks","A historical case study about a real railway disaster and its legal aftermath","A mathematical probability problem about the relative risks of different transport modes"],ans:1,fact:"The trolley problem, created by philosopher Philippa Foot in 1967, poses this: a runaway trolley will kill 5 people; you can divert it to kill only 1. Should you? Utilitarian ethics says yes (greatest good for the greatest number). Kantian ethics says no (using a person purely as a means to an end violates human dignity). There is no universally agreed answer — that is precisely the point. Real-world versions of this dilemma face doctors rationing limited resources, self-driving car engineers programming accident responses, and military commanders making targeting decisions. Engaging seriously with ethical frameworks isn't academic — it prepares you to make principled decisions in the genuinely difficult situations that real life will present."},
{cat:"💰 Financial Literacy",q:"In personal finance, what is the fundamental distinction between an 'asset' and a 'liability'?",opts:["They are interchangeable terms — both describe the total of what you own financially","An asset puts money into your pocket over time; a liability takes money out of your pocket over time — regardless of what it is or how much it cost","Assets are exclusively relevant to business accounting — they have no meaning in personal finance","Liabilities are always illegal or fraudulent financial instruments that should be avoided"],ans:1,fact:"This distinction, powerfully explained by Robert Kiyosaki in 'Rich Dad Poor Dad,' is the cornerstone of financial intelligence. A car used for commuting is typically a liability — it takes money from your pocket via fuel, insurance, and depreciation. The same car used professionally to generate income is an asset. Your education is your greatest potential asset — investing in skills that the market values compounds over an entire career. Most people remain financially stressed not from low income but from accumulating liabilities (gadgets, subscriptions, depreciating vehicles on EMI) while calling them assets. Every significant purchase decision becomes clearer when you ask one simple question: 'Will this put money in my pocket over time, or take it out?'"}
]
];

// ── GAME STATE ──
let playerName="",ageGroup=0,questions=[],qIndex=0;
let selectedOpt=-1,state="idle";
let ll50Used=false,llAudUsed=false,llFlipUsed=false;
let safeAmount="₹0",afterFact=null;

function selectAge(n){
  ageGroup=n;
  document.getElementById("age1").classList.toggle("sel",n===1);
  document.getElementById("age2").classList.toggle("sel",n===2);
  checkStart();
}
document.getElementById("nameInput").addEventListener("input",checkStart);
function checkStart(){
  const n=document.getElementById("nameInput").value.trim();
  document.getElementById("startBtn").disabled=!(n&&ageGroup);
}

function startGame(){
  playerName=document.getElementById("nameInput").value.trim();
  const bank=ageGroup===1?Q_YOUNG:Q_OLDER;
  questions=bank[Math.floor(Math.random()*bank.length)];
  qIndex=0;ll50Used=false;llAudUsed=false;llFlipUsed=false;safeAmount="₹0";afterFact=null;
  showScreen("game");buildPrizeSide();resetLifelines();loadQuestion();
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function buildPrizeSide(){
  const side=document.getElementById("prizeSide");side.innerHTML="";
  for(let i=14;i>=0;i--){
    const d=document.createElement("div");
    d.className="pz"+(SAFE.includes(i)?" safe":"");d.id="pz"+i;
    d.innerHTML=`<span class="pz-n">${i+1}</span><span class="pz-amt">${PRIZES[i]}</span>${SAFE.includes(i)?"⭐":""}`;
    side.appendChild(d);
  }
}

function updatePrizeSide(){
  for(let i=0;i<15;i++){
    const el=document.getElementById("pz"+i);
    el.className="pz"+(SAFE.includes(i)?" safe":"");
    if(i<qIndex)el.classList.add("won");
    if(i===qIndex)el.classList.add("active");
  }
}

function resetLifelines(){
  document.getElementById("ll50").disabled=false;
  document.getElementById("llAud").disabled=false;
  document.getElementById("llFlip").disabled=false;
}

function loadQuestion(){
  if(qIndex>=15){showResult(true);return;}
  const q=questions[qIndex];
  state="idle";selectedOpt=-1;
  SAFE.forEach(s=>{if(qIndex>s)safeAmount=PRIZES[s];});
  document.getElementById("qCat").textContent=q.cat;
  document.getElementById("qNum").textContent=`Question ${qIndex+1} of 15`;
  document.getElementById("qText").textContent=q.q;
  document.getElementById("playerTag").textContent="👤 "+playerName;
  document.getElementById("safeTag").textContent="Safe: "+safeAmount;
  document.getElementById("lockBtn").style.display="none";
  document.getElementById("nextBtn").style.display="none";
  const grid=document.getElementById("optsGrid");grid.innerHTML="";
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.className="opt-btn";btn.id="opt"+i;
    btn.innerHTML=`<span class="opt-lbl">${LABELS[i]}</span><span>${opt}</span>`;
    btn.onclick=()=>selectOption(i);
    grid.appendChild(btn);
  });
  updatePrizeSide();
}

function selectOption(i){
  if(state!=="idle"&&state!=="selected")return;
  const btn=document.getElementById("opt"+i);
  if(btn.classList.contains("elim"))return;
  selectedOpt=i;state="selected";
  document.querySelectorAll(".opt-btn").forEach((b,j)=>{b.classList.remove("selected");if(j===i)b.classList.add("selected");});
  document.getElementById("lockBtn").style.display="inline-block";
}

function lockIn(){
  if(state!=="selected")return;
  state="locked";
  document.getElementById("lockBtn").style.display="none";
  document.getElementById("opt"+selectedOpt).classList.remove("selected");
  document.getElementById("opt"+selectedOpt).classList.add("locked-state");
  document.querySelectorAll(".opt-btn").forEach(b=>b.style.pointerEvents="none");
  setTimeout(()=>revealAnswer(),2000);
}

function revealAnswer(){
  state="revealed";
  const q=questions[qIndex];
  const correct=q.ans,chosen=selectedOpt;
  document.getElementById("opt"+correct).classList.add("correct");
  document.getElementById("opt"+correct).classList.remove("locked-state");
  if(chosen!==correct){
    document.getElementById("opt"+chosen).classList.add("wrong");
    document.getElementById("opt"+chosen).classList.remove("locked-state");
  }
  if(chosen===correct)showConfetti(chosen===correct&&qIndex===14?100:6);
  setTimeout(()=>showFact(q,chosen===correct),1500);
}

function showFact(q,wasCorrect){
  document.getElementById("factCat").textContent=q.cat;
  document.getElementById("factCorrect").textContent="✓ Correct Answer: "+q.opts[q.ans];
  document.getElementById("factBody").textContent=q.fact;
  afterFact=wasCorrect?(qIndex>=14?"win":"next"):"gameover";
  document.getElementById("factBackdrop").classList.add("show");
  document.getElementById("factModal").classList.add("show");
  document.getElementById("factModal").scrollTop=0;
}

function closeFact(){
  document.getElementById("factBackdrop").classList.remove("show");
  document.getElementById("factModal").classList.remove("show");
  if(afterFact==="next")document.getElementById("nextBtn").style.display="inline-block";
  else if(afterFact==="win")showResult(true);
  else showResult(false);
}

function nextQuestion(){
  qIndex++;
  if(SAFE.includes(qIndex-1))safeAmount=PRIZES[qIndex-1];
  if(qIndex>=15){showResult(true);return;}
  loadQuestion();
}

function use5050(){
  if(ll50Used||state==="locked"||state==="revealed")return;
  ll50Used=true;document.getElementById("ll50").disabled=true;
  const correct=questions[qIndex].ans;
  const wrong=[0,1,2,3].filter(i=>i!==correct).sort(()=>Math.random()-.5).slice(0,2);
  wrong.forEach(i=>{
    document.getElementById("opt"+i).classList.add("elim");
    if(selectedOpt===i){selectedOpt=-1;state="idle";document.getElementById("lockBtn").style.display="none";}
  });
}

function useAudience(){
  if(llAudUsed||state==="locked"||state==="revealed")return;
  llAudUsed=true;document.getElementById("llAud").disabled=true;
  const correct=questions[qIndex].ans;
  const cp=40+Math.floor(Math.random()*25);
  const rem=100-cp;
  const wrong=[0,1,2,3].filter(i=>i!==correct);
  const sp=splitN(rem,3);
  const pcts=[0,0,0,0];pcts[correct]=cp;
  wrong.forEach((wi,j)=>pcts[wi]=sp[j]);
  const rows=document.getElementById("pollRows");rows.innerHTML="";
  LABELS.forEach((_,i)=>{
    rows.innerHTML+=`<div class="poll-row"><div class="poll-lbl"><span>${LABELS[i]}: ${questions[qIndex].opts[i]}</span><span>${pcts[i]}%</span></div><div class="poll-track"><div class="poll-fill" id="pf${i}"></div></div></div>`;
  });
  document.getElementById("backdrop").classList.add("show");
  document.getElementById("audienceModal").classList.add("show");
  setTimeout(()=>LABELS.forEach((_,i)=>{document.getElementById("pf"+i).style.width=pcts[i]+"%";}),100);
}

function splitN(total,n){
  let p=[];for(let i=0;i<n-1;i++){const x=Math.floor(Math.random()*(total-(n-i-1)));p.push(x);total-=x;}p.push(total);return p.sort(()=>Math.random()-.5);
}

function closeAudience(){
  document.getElementById("backdrop").classList.remove("show");
  document.getElementById("audienceModal").classList.remove("show");
}

function useFlip(){
  if(llFlipUsed||state==="locked"||state==="revealed")return;
  llFlipUsed=true;document.getElementById("llFlip").disabled=true;
  qIndex++;if(qIndex>=15){showResult(true);return;}
  loadQuestion();showToast("Question skipped — no money lost!");
}

function quitGame(){
  if(!confirm(`Quit now and take home ${safeAmount}?`))return;
  showResultWith(safeAmount,false,true);
}

function showResult(won){
  if(won&&qIndex>=15)showResultWith(PRIZES[14],true,false);
  else if(won)showResultWith(PRIZES[qIndex-1],true,false);
  else showResultWith(safeAmount,false,false);
}

function showResultWith(amount,won,quit){
  const emoji=won?(amount===PRIZES[14]?"🏆":"🎉"):(quit?"👋":"😢");
  const cls=(won||quit)?"win":"lose";
  const title=won?(amount===PRIZES[14]?"CROREPATI!":"Congratulations!"):(quit?"See You Next Time!":"Oh No!");
  const msg=won?`Incredible, ${playerName}! You answered all the way to ${amount}!`:(quit?`You walked away with ${amount}. Smart thinking, ${playerName}!`:`Don't worry, ${playerName}! You go home with ${safeAmount}. Every answer you got right taught you something valuable — try again!`);
  document.getElementById("rEmoji").textContent=emoji;
  document.getElementById("rTitle").textContent=title;
  document.getElementById("rTitle").className="r-title "+cls;
  document.getElementById("rAmount").textContent=quit?amount:(won?amount:safeAmount);
  document.getElementById("rMsg").textContent=msg;
  showScreen("result");
  if(won)showConfetti(amount===PRIZES[14]?150:40);
}

function resetGame(){
  showScreen("welcome");
  document.getElementById("nameInput").value="";
  document.getElementById("age1").classList.remove("sel");
  document.getElementById("age2").classList.remove("sel");
  ageGroup=0;document.getElementById("startBtn").disabled=true;
}

function showConfetti(count){
  const cols=["#ffd700","#ff8c00","#00ff88","#ff69b4","#00bfff","#ff4444","#c0c0ff"];
  for(let i=0;i<count;i++)setTimeout(()=>{
    const cf=document.createElement("div");cf.className="cf";
    cf.style.left=Math.random()*100+"vw";cf.style.background=cols[Math.floor(Math.random()*cols.length)];
    cf.style.animationDuration=(1.5+Math.random()*2)+"s";cf.style.borderRadius=Math.random()>.5?"50%":"2px";
    document.body.appendChild(cf);setTimeout(()=>cf.remove(),4000);
  },i*25);
}

function showToast(msg){
  const t=document.createElement("div");
  t.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);border:2px solid #ffd700;border-radius:50px;padding:11px 24px;color:#ffd700;font-weight:700;z-index:400;font-size:.9rem;";
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}
</script>
